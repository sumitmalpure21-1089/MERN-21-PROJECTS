version: '3.8'
services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  backend:
    build: .
    command: ["/bin/sh", "-c", "bundle exec rails db:prepare && bundle exec rails server -b 0.0.0.0"]
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    depends_on:
      - db  
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/task_management_development
      RAILS_ENV: development
volumes:
  postgres_data:
  bundle_cache: